[project]
name = "project-health-predictor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
ui = [
  "streamlit>=1.31",
  "matplotlib>=3.8",
]

[project.scripts]
health = "project_health.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
